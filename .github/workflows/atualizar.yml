name: Atualizar Dados Defesa Civil

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora
  workflow_dispatch: # Permite rodar manualmente na aba Actions

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite que o bot faça commit do JSON atualizado

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: pip install requests

      - name: Executar Script de Atualização
        run: python atualizar_dados.py

      - name: Enviar JSON Atualizado para o Repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-atualização dos dados meteorológicos [skip ci]"
          file_pattern: dados_oficiais.json
