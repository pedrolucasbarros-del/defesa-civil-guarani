name: Atualizar Dados SIMGE e INMET

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar Dependências
        run: |
          pip install requests beautifulsoup4

      - name: Executar Script Python
        run: python atualizar_dados.py

      - name: Salvar e Enviar dados_oficiais.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add dados_oficiais.json
          git commit -m "Automático: Atualização do dados_oficiais.json" || echo "Sem alterações para enviar"
          git push origin principal || git push origin main
