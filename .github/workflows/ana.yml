name: Atualizar Dados ANA - Rio Pomba

on:
  schedule:
    # Roda a cada 30 minutos (em UTC). Ajuste conforme a frequência desejada.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    # Permite disparar manualmente pela aba Actions no GitHub

permissions:
  contents: write

jobs:
  atualizar-ana:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar script de coleta da ANA
        env:
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}
          ANA_ESTACAO_POMBA: ${{ vars.ANA_ESTACAO_POMBA || '58730001' }}
        run: python atualizar_ana.py

      - name: Commit e push do dados_ana_pomba.json se houver alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dados_ana_pomba.json

          if git diff --staged --quiet; then
            echo "Nenhuma alteração em dados_ana_pomba.json."
          else
            git commit -m "chore: atualiza dados_ana_pomba.json via ANA"
            git push
          fi
