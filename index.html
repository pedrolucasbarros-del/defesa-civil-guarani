<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Operacional — Defesa Civil Guarani/MG</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent: #58a6ff;
            --verde: #238636;
            --amarelo: #9e6a03;
            --vermelho: #da3633;
            --vermelho-escuro: #8f1d1d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
            color: #ffffff;
        }

        .ultima-atualizacao {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
        }

        /* Indicador de Status de Alerta */
        .status-box {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 4px;
            color: #fff;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        .bg-verde { background-color: var(--verde); }
        .bg-amarelo { background-color: var(--amarelo); }
        .bg-vermelho { background-color: var(--vermelho); }
        .bg-vermelho-escuro { background-color: var(--vermelho-escuro); }

        .clima-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .metric-item {
            background: #0d1117;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        /* Lista de Contatos */
        .contatos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .contato-card {
            background: #0d1117;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 6px;
        }

        .contato-orgao {
            font-weight: bold;
            color: #ffffff;
            font-size: 0.95rem;
        }

        .contato-numero {
            font-size: 1.2rem;
            color: var(--accent);
            margin: 5px 0;
            font-weight: bold;
        }

        .contato-desc {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🛡️ Defesa Civil — Guarani/MG</h1>
            <div class="ultima-atualizacao" id="atualizacao">Carregando...</div>
        </header>

        <!-- Bloco de Status de Alerta Municipal -->
        <div class="card">
            <div class="card-title">
                <span>Status Operacional do Município</span>
                <span id="nivel-badge" class="badge bg-verde">Carregando</span>
            </div>
            <p id="alerta-desc" style="color: var(--text-muted); line-height: 1.5; margin-bottom: 15px;">Aguardando dados dos modelos meteorológicos...</p>
            
            <div class="clima-metrics">
                <div class="metric-item">
                    <div class="metric-value" id="temp-val">--</div>
                    <div class="metric-label">Temperatura</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value" id="chuva-val">--</div>
                    <div class="metric-label">Previsão de Chuva</div>
                </div>
                <div class="metric-item">
                    <div class="metric-value" id="vento-val">--</div>
                    <div class="metric-label">Velocidade do Vento</div>
                </div>
            </div>
        </div>

        <!-- Bloco de Contatos de Emergência -->
        <div class="card">
            <div class="card-title">Diretório de Contatos de Emergência</div>
            <div class="contatos-grid" id="grid-contatos">
                <!-- Preenchido via JavaScript -->
            </div>
        </div>
    </div>

    <script>
        async function carregarDados() {
            try {
                // Adiciona parâmetro de tempo para evitar cache do navegador
                const resposta = await fetch('dados_oficiais.json?t=' + new Date().getTime());
                if (!resposta.ok) throw new Error('Erro ao carregar dados');
                
                const dados = await resposta.json();

                // Atualiza cabeçalho
                document.getElementById('atualizacao').innerText = 'Atualizado em: ' + dados.ultima_atualizacao;

                // Atualiza Status de Alerta
                const alerta = dados.status_alerta;
                document.getElementById('alerta-desc').innerText = alerta.descricao;
                document.getElementById('temp-val').innerText = alerta.temperatura;
                document.getElementById('chuva-val').innerText = alerta.precipitacao;
                document.getElementById('vento-val').innerText = alerta.vento;

                const badge = document.getElementById('nivel-badge');
                badge.innerText = alerta.nivel;
                
                // Define a cor do badge com base no nível
                badge.className = 'badge';
                if (alerta.nivel === 'Normalidade') badge.classList.add('bg-verde');
                else if (alerta.nivel === 'Atenção') badge.classList.add('bg-amarelo');
                else if (alerta.nivel === 'Alerta') badge.classList.add('bg-vermelho');
                else if (alerta.nivel === 'Alerta Máximo') badge.classList.add('bg-vermelho-escuro');
                else badge.classList.add('bg-verde');

                // Preenche os Contatos de Emergência
                const gridContatos = document.getElementById('grid-contatos');
                gridContatos.innerHTML = '';
                
                dados.contatos_emergencia.forEach(c => {
                    const item = document.createElement('div');
                    item.className = 'contato-card';
                    item.innerHTML = `
                        <div class="contato-orgao">${c.orgao}</div>
                        <div class="contato-numero">${c.numero}</div>
                        <div class="contato-desc">${c.descricao}</div>
                    `;
                    gridContatos.appendChild(item);
                });

            } catch (erro) {
                console.error('Erro ao atualizar painel:', erro);
                document.getElementById('alerta-desc').innerText = 'Erro ao sincronizar informações operacionais.';
            }
        }

        // Carrega ao iniciar e atualiza a cada 5 minutos
        carregarDados();
        setInterval(carregarDados, 300000);
    </script>
</body>
</html>
